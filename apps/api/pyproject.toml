[project]
name = "utsavai-api"
version = "0.1.0"
description = "UtsavAI FastAPI modular monolith (Phase 1: foundation)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "pyjwt[crypto]>=2.9,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.27,<1",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
  "openapi-spec-validator>=0.7,<1",
  "pip-audit>=2.7,<3",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "PT"]
ignore = ["B008", "S101"]  # B008: FastAPI Depends() defaults are idiomatic; S101: invariant asserts

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608", "E501", "B017", "PT011", "PT012", "SIM117", "S311", "PT018", "PT006", "PT022"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real PostgreSQL (set TEST_DATABASE_ADMIN_URL and TEST_DATABASE_URL)"]
filterwarnings = ["error::DeprecationWarning:app.*"]
