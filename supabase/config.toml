# Supabase CLI project configuration (https://supabase.com/docs/guides/cli).
# Used by `supabase start` for a local stack and by `supabase db push` for hosted projects.
project_id = "utsavai"

[api]
enabled = true
port = 54321
schemas = ["public"]          # the app schema (helpers) is intentionally NOT exposed
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true    # set false only in the dedicated E2E test project
minimum_password_length = 8
